# The configuration `make render` runs chezmoi with: placeholder data for the
# five keys the templates read, none of them a real value. The real values
# live in ~/.config/chezmoi/chezmoi.toml on a workstation, generated by
# .chezmoi.toml.tmpl at `chezmoi init` and never committed.

[data]
    bwserver = ""

[data.forge]
    host = "forge.example.invalid"
    slug = "example"

[data.work]
    dir = ""
    config = ""
